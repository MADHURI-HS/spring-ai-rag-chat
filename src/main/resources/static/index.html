<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>docbot — Spring Boot Reference</title>
    <style>
        :root {
          --ink: #14171a;
          --panel: #1b1f1d;
          --paper: #e9e6dc;
          --paper-dim: #b8b4a6;
          --leaf: #4a7c59;
          --leaf-bright: #6fae7f;
          --amber: #c9a34e;
          --rule: #2c322d;
        }

        * { box-sizing: border-box; }

        html, body {
          margin: 0;
          height: 100%;
          background: var(--ink);
          color: var(--paper);
          font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        .mono {
          font-family: 'JetBrains Mono', 'SF Mono', Menlo, monospace;
        }

        .app {
          display: flex;
          flex-direction: column;
          height: 100vh;
          max-width: 760px;
          margin: 0 auto;
        }

        header {
          padding: 28px 24px 18px;
          border-bottom: 1px solid var(--rule);
        }

        .eyebrow {
          font-size: 11px;
          letter-spacing: 0.14em;
          text-transform: uppercase;
          color: var(--leaf-bright);
          margin: 0 0 6px;
        }

        h1 {
          font-size: 22px;
          margin: 0 0 8px;
          font-weight: 600;
          letter-spacing: -0.01em;
        }

        .doc-tag {
          display: inline-flex;
          align-items: center;
          gap: 8px;
          font-size: 12.5px;
          color: var(--paper-dim);
          padding: 5px 10px;
          border: 1px solid var(--rule);
          border-radius: 3px;
        }

        .doc-dot {
          width: 6px;
          height: 6px;
          border-radius: 50%;
          background: var(--leaf-bright);
          box-shadow: 0 0 6px var(--leaf-bright);
        }

        .thread {
          flex: 1;
          overflow-y: auto;
          padding: 24px;
          display: flex;
          flex-direction: column;
          gap: 18px;
        }

        .empty {
          margin: auto;
          text-align: center;
          color: var(--paper-dim);
          max-width: 380px;
        }

        .empty .glyph {
          font-size: 28px;
          margin-bottom: 10px;
          opacity: 0.6;
        }

        .empty p {
          font-size: 13.5px;
          line-height: 1.6;
          margin: 6px 0 0;
        }

        .msg {
          display: flex;
          flex-direction: column;
          gap: 6px;
          max-width: 88%;
          animation: rise 0.25s ease-out;
        }

        @keyframes rise {
          from { opacity: 0; transform: translateY(6px); }
          to { opacity: 1; transform: translateY(0); }
        }

        .msg.user { align-self: flex-end; align-items: flex-end; }
        .msg.bot { align-self: flex-start; align-items: flex-start; }

        .label {
          font-size: 10.5px;
          letter-spacing: 0.1em;
          text-transform: uppercase;
          color: var(--paper-dim);
          padding: 0 2px;
        }

        .bubble {
          padding: 12px 15px;
          border-radius: 4px;
          font-size: 14.5px;
          line-height: 1.6;
          white-space: pre-wrap;
        }

        .msg.user .bubble {
          background: var(--leaf);
          color: #0f140f;
          border-radius: 4px 4px 2px 4px;
        }

        .msg.bot .bubble {
          background: var(--panel);
          border: 1px solid var(--rule);
          border-radius: 4px 4px 4px 2px;
        }

        .source {
          font-size: 11px;
          color: var(--amber);
          padding: 0 2px;
          display: flex;
          align-items: center;
          gap: 5px;
        }

        .thinking {
          display: flex;
          align-items: center;
          gap: 10px;
          font-size: 12.5px;
          color: var(--paper-dim);
          padding: 12px 15px;
        }

        .dot-flow {
          display: flex;
          gap: 4px;
        }

        .dot-flow span {
          width: 5px;
          height: 5px;
          border-radius: 50%;
          background: var(--leaf-bright);
          animation: pulse 1.1s infinite ease-in-out;
        }
        .dot-flow span:nth-child(2) { animation-delay: 0.15s; }
        .dot-flow span:nth-child(3) { animation-delay: 0.3s; }

        @keyframes pulse {
          0%, 60%, 100% { opacity: 0.25; transform: scale(0.85); }
          30% { opacity: 1; transform: scale(1); }
        }

        form {
          display: flex;
          gap: 10px;
          padding: 16px 24px 24px;
          border-top: 1px solid var(--rule);
        }

        textarea {
          flex: 1;
          resize: none;
          background: var(--panel);
          border: 1px solid var(--rule);
          border-radius: 4px;
          color: var(--paper);
          font-family: inherit;
          font-size: 14px;
          padding: 12px 14px;
          height: 46px;
          line-height: 1.4;
        }

        textarea:focus {
          outline: none;
          border-color: var(--leaf);
        }

        textarea::placeholder { color: var(--paper-dim); }

        button {
          background: var(--leaf);
          border: none;
          border-radius: 4px;
          color: #0f140f;
          font-family: inherit;
          font-weight: 600;
          font-size: 13px;
          padding: 0 20px;
          cursor: pointer;
          transition: background 0.15s ease;
        }

        button:hover:not(:disabled) { background: var(--leaf-bright); }
        button:disabled { opacity: 0.4; cursor: not-allowed; }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-thumb { background: var(--rule); border-radius: 4px; }
    </style>
</head>
<body>

<div class="app">
    <header>
        <p class="eyebrow mono">rag chat · local</p>
        <h1>docbot</h1>
        <span class="doc-tag mono"><span class="doc-dot"></span>spring-boot-reference.pdf</span>
    </header>

    <div class="thread" id="thread">
        <div class="empty" id="empty">
            <div class="glyph">〈/〉</div>
            <p>Ask anything about Spring Boot — auto-configuration, actuator, testing, properties. Answers are grounded in the loaded reference doc, not memory.</p>
        </div>
    </div>

    <form id="form">
        <textarea id="input" placeholder="Ask about Spring Boot…" rows="1"></textarea>
        <button type="submit" id="send">Ask</button>
    </form>
</div>

<script>
    const thread = document.getElementById('thread');
    const empty = document.getElementById('empty');
    const form = document.getElementById('form');
    const input = document.getElementById('input');
    const send = document.getElementById('send');
    const conversationId = 'ui-' + Math.random().toString(36).slice(2, 10);

    function addMessage(role, text, source) {
      if (empty) empty.remove();
      const msg = document.createElement('div');
      msg.className = 'msg ' + role;

      const label = document.createElement('div');
      label.className = 'label mono';
      label.textContent = role === 'user' ? 'you' : 'docbot';
      msg.appendChild(label);

      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = text;
      msg.appendChild(bubble);

      if (source) {
        const src = document.createElement('div');
        src.className = 'source mono';
        src.textContent = '⌘ grounded in spring-boot-reference.pdf';
        msg.appendChild(src);
      }

      thread.appendChild(msg);
      thread.scrollTop = thread.scrollHeight;
      return msg;
    }

    function addThinking() {
      const el = document.createElement('div');
      el.className = 'thinking mono';
      el.id = 'thinking';
      el.innerHTML = 'searching reference doc <span class="dot-flow"><span></span><span></span><span></span></span>';
      thread.appendChild(el);
      thread.scrollTop = thread.scrollHeight;
    }

    function removeThinking() {
      const el = document.getElementById('thinking');
      if (el) el.remove();
    }

    async function ask(question) {
      addMessage('user', question);
      addThinking();
      send.disabled = true;

      try {
        const res = await fetch('/ask', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X_CONV_ID': conversationId
          },
          body: JSON.stringify({ question })
        });
        const data = await res.json();
        removeThinking();
        addMessage('bot', data.answer || '(no answer returned)', true);
      } catch (err) {
        removeThinking();
        addMessage('bot', 'Something went wrong reaching the server. Is the app still running?');
      } finally {
        send.disabled = false;
        input.focus();
      }
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const q = input.value.trim();
      if (!q) return;
      input.value = '';
      input.style.height = '46px';
      ask(q);
    });

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        form.requestSubmit();
      }
    });

    input.addEventListener('input', () => {
      input.style.height = '46px';
      input.style.height = Math.min(input.scrollHeight, 140) + 'px';
    });
</script>

</body>
</html>
